name = "Wang2026Almost"
defaultTargets = ["Wang2026Almost"]
lintDriver = "batteries/runLinter"

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
# LMLExplore's settings, which ForLMLExplore/ must meet. The two long-file options must agree, or
# the linter asks for a `set_option` in every short file.
weak.linter.style.header = true
weak.linter.style.longFile = 1500
weak.linter.style.longFileDefValue = 1500

# LMLExplore brings Mathlib, Tau Ceti and LML at the versions it pins: never require them here.
[[require]]
name = "LMLExplore"
git = "https://github.com/LeanMachineLearning/LMLExplore"
rev = "main"

[[require]]
name = "checkdecls"
git = "https://github.com/PatrickMassot/checkdecls.git"

[[lean_lib]]
name = "Wang2026Almost"

# Comparator (https://github.com/leanprover/comparator) challenge and solution modules for the
# headline results listed in formalization.yaml; see comparator/README.md. One library with a stub
# root: tools that import every library root (checkdecls) must not load the challenge modules,
# which redeclare project and LMLExplore names, so those are globs, not roots. Add one
# "Challenge_<name>" entry per line of comparator/targets.txt.
[[lean_lib]]
name = "Comparator"
srcDir = "comparator"
leanOptions = { weak.linter.mathlibStandardSet = false, weak.linter.style.header = false }
globs = [
  "Comparator",
  "Solution",
  "Challenge_sum_sq_criterion",
  "Challenge_ae_not_summable_of_isBigOmegaInProb",
  "Challenge_ae_not_summable_sum_sq_div_sq",
  "Challenge_tendsto_wealth_zero_of_isBigOmega",
  "Challenge_kt_bankrupt",
  "Challenge_grapa_bankrupt",
  "Challenge_agrapa_bankrupt",
  "Challenge_hedged_bankrupt",
  "Challenge_tendsto_mixtureWealth",
  "Challenge_tendsto_mixtureWealth_betaMixture",
  "Challenge_tendsto_mixtureWealth_robbinsMixture",
  "Challenge_exists_improve",
  "Challenge_tendstoInDistribution_hindsightLogWealth",
  "Challenge_not_bddAbove_logRegret_of_tendsto_wealth_zero",
  "Challenge_sum_sq_criterion_subgaussian",
  "Challenge_tendsto_subgaussianMixtureTest",
]
